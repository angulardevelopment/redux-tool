name: AI CI/CD Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-and-review:
    name: Build Verification & AI Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Build Application
        id: build
        run: npm run build
        continue-on-error: true

      - name: Generate PR Git Diff
        id: pr-diff
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "DIFF_SIZE=$(wc -l < pr_diff.txt)" >> $GITHUB_OUTPUT

      - name: AI Code Review (Google Gemini)
        if: github.event_name == 'pull_request' && steps.pr-diff.outputs.DIFF_SIZE > 0
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINT_STATUS: ${{ steps.lint.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
        with:
          script: |
            const reviewer = require('./.github/scripts/ai-pr-reviewer.js');
            await reviewer({ github, context });

      - name: Fail job if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
